<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Flores Amarillas para Ti 🌻</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020302;font-family:Arial,sans-serif}
body{color:#fff}
button{font:inherit}

#app{
  position:relative;width:100%;height:100%;
  overflow:hidden;background:
  radial-gradient(circle at 50% 48%,rgba(255,211,58,.20),transparent 19%),
  radial-gradient(circle at 50% 85%,rgba(255,194,0,.12),transparent 35%),
  #020302;
}

/* stars / dust */
#stars,#petals,#words{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff9c9;opacity:.65;
  animation:twinkle var(--t) ease-in-out infinite alternate;
}
@keyframes twinkle{from{transform:scale(.45);opacity:.2}to{transform:scale(1.7);opacity:1}}

.dust{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:#ffe96b;box-shadow:0 0 8px #ffd83d;
  animation:rise var(--t) linear infinite;
}
@keyframes rise{
  0%{transform:translate(0,25px) scale(.3);opacity:0}
  15%{opacity:.9}
  100%{transform:translate(var(--x),-120vh) scale(1.3);opacity:0}
}

/* central glow */
#glow{
  position:absolute;left:50%;top:49%;width:44vw;height:44vw;
  max-width:280px;max-height:280px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,237,115,.55),rgba(255,199,0,.12) 42%,transparent 72%);
  filter:blur(8px);animation:glow 2.8s ease-in-out infinite;
}
@keyframes glow{50%{transform:translate(-50%,-50%) scale(1.16);opacity:.65}}

/* heart made from text/outline */
#heart{
  position:absolute;left:50%;top:31%;
  transform:translateX(-50%);
  width:145px;height:125px;
  filter:drop-shadow(0 0 9px rgba(255,224,74,.75));
}
#heart:before,#heart:after{
  content:"";position:absolute;top:7px;width:72px;height:105px;
  border:5px solid #ffe85b;border-radius:55px 55px 0 0;
  background:transparent;
}
#heart:before{left:25px;transform:rotate(-45deg);transform-origin:0 100%}
#heart:after{left:48px;transform:rotate(45deg);transform-origin:100% 100%}
.heartText{
  position:absolute;z-index:3;top:51px;left:50%;
  transform:translateX(-50%);white-space:nowrap;
  font-family:Georgia,serif;font-size:14px;font-weight:bold;
  color:#fff8bd;text-shadow:0 0 8px #ffd92f;
}

/* sunflowers */
.flower{
  position:absolute;width:82px;height:82px;
  transform:translate(-50%,-50%) scale(0);
  animation:bloom .8s cubic-bezier(.2,1.5,.5,1) forwards;
  filter:drop-shadow(0 0 5px rgba(255,205,45,.45));
}
@keyframes bloom{to{transform:translate(-50%,-50%) scale(1)}}
.flower .petal{
  position:absolute;left:50%;top:50%;width:25px;height:39px;
  margin:-19px -12px;border-radius:55% 55% 45% 45%;
  background:linear-gradient(#ffe75a,#e9a91e);
  transform:rotate(calc(var(--i)*45deg)) translateY(-19px);
  transform-origin:50% 19px;
}
.flower .center{
  position:absolute;left:50%;top:50%;width:26px;height:26px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#6b3a09 0 35%,#3e2207 38% 100%);
  box-shadow:0 0 5px #ffd33e;
}
.flower.small{transform:translate(-50%,-50%) scale(.62)}
.flower.tiny{transform:translate(-50%,-50%) scale(.43)}

/* bouquet */
.bouquet{
  position:absolute;left:50%;top:55%;
  width:118px;height:150px;transform:translateX(-50%);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{50%{transform:translateX(-50%) translateY(-6px)}}
.stem{position:absolute;left:50%;top:58px;width:3px;height:78px;background:#5e9630;transform-origin:top}
.stem.s1{transform:rotate(-20deg)} .stem.s2{transform:rotate(18deg)} .stem.s3{transform:rotate(4deg)}
.bouquet .flower{top:35px;left:50%;animation-delay:1.15s}
.bouquet .flower.f2{left:27%;top:55px;animation-delay:1.28s}
.bouquet .flower.f3{left:74%;top:56px;animation-delay:1.4s}
.wrap{
  position:absolute;left:50%;top:93px;width:67px;height:49px;
  transform:translateX(-50%);
  background:linear-gradient(145deg,#ffe1a4,#fff3ce);
  clip-path:polygon(7% 0,93% 0,70% 100%,30% 100%);
  filter:drop-shadow(0 2px 4px rgba(255,210,50,.3));
}

/* phrases */
.word{
  position:absolute;color:#fffbd1;font-weight:bold;font-size:12px;
  text-shadow:0 0 7px #ffc400;white-space:nowrap;
  animation:wordIn .7s ease both, wordFloat 3.5s ease-in-out infinite 1s;
}
@keyframes wordIn{from{opacity:0;transform:scale(.5)}to{opacity:.95;transform:scale(1)}}
@keyframes wordFloat{50%{margin-top:-5px}}

#wave{
  position:absolute;left:50%;top:62%;width:190px;height:55px;
  transform:translateX(-50%);border-radius:50%;
  border:4px solid rgba(255,237,120,.8);
  box-shadow:0 0 18px rgba(255,216,48,.7),inset 0 0 18px rgba(255,216,48,.35);
  animation:pulse 2s ease-in-out infinite;
}
#wave:after{
  content:"";position:absolute;inset:9px 24px;border:3px solid rgba(255,242,135,.75);
  border-radius:50%;transform:rotate(-8deg);
}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.1);opacity:.65}}

#intro{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(70,55,5,.55),#010201 72%);
  transition:opacity .8s ease,visibility .8s;
}
.introCard{text-align:center;padding:30px}
.introCard .mini{font-size:14px;color:#ffe77a;letter-spacing:2px}
.introCard h1{font-family:Georgia,serif;font-size:30px;margin:12px 0;color:#fff6b4;text-shadow:0 0 15px #dcae19}
.introCard p{color:#ddd7b0;margin-bottom:26px}
#openBtn{
  border:1px solid rgba(255,229,99,.7);background:rgba(255,207,46,.13);
  color:#fff5aa;border-radius:999px;padding:13px 28px;
  box-shadow:0 0 20px rgba(255,210,40,.2);cursor:pointer;
}
#openBtn:active{transform:scale(.96)}
#intro.hide{opacity:0;visibility:hidden}

#finalCard{
  position:absolute;z-index:10;left:50%;bottom:5.5%;
  transform:translate(-50%,25px);width:min(86%,390px);
  background:rgba(20,17,7,.72);border:1px solid rgba(255,222,90,.35);
  backdrop-filter:blur(7px);border-radius:18px;padding:14px 18px;
  text-align:center;opacity:0;transition:.9s ease;
  pointer-events:none;
}
#finalCard.show{opacity:1;transform:translate(-50%,0)}
#finalCard strong{display:block;color:#fff1a0;font-family:Georgia,serif;font-size:20px}
#finalCard span{display:block;color:#eee7c4;font-size:12px;margin-top:5px}

#music{
  position:absolute;z-index:12;right:12px;top:12px;
  border:1px solid rgba(255,231,92,.35);background:rgba(0,0,0,.35);
  color:#fff2a0;border-radius:50%;width:40px;height:40px;cursor:pointer;
  opacity:.75;
}
</style>
</head>
<body>
<div id="app">
  <div id="stars"></div>
  <div id="petals"></div>
  <div id="words"></div>

  <div id="glow"></div>
  <div id="heart"><div class="heartText">Te amo 💛</div></div>
  <div id="wave"></div>

  <div class="flower" style="left:17%;top:35%;animation-delay:.6s"></div>
  <div class="flower small" style="left:82%;top:39%;animation-delay:.9s"></div>
  <div class="flower tiny" style="left:28%;top:62%;animation-delay:1.1s"></div>
  <div class="flower small" style="left:77%;top:66%;animation-delay:1.3s"></div>
  <div class="flower tiny" style="left:48%;top:77%;animation-delay:1.5s"></div>

  <div class="bouquet">
    <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div>
    <div class="flower"></div><div class="flower f2"></div><div class="flower f3"></div>
    <div class="wrap"></div>
  </div>

  <div id="finalCard">
    <strong>Flores amarillas para ti 🌻</strong>
    <span>Porque algunas cosas bonitas merecen ser entregadas con flores.</span>
  </div>

  <button id="music" aria-label="activar sonido">♪</button>

  <div id="intro">
    <div class="introCard">
      <div class="mini">PARA TI 🌻</div>
      <h1>Tengo algo para ti</h1>
      <p>Abre esto y mira lo que preparé.</p>
      <button id="openBtn">ABRIR 💛</button>
    </div>
  </div>
</div>

<audio id="bgMusic" src="musica_fondo.mp3" preload="auto" loop></audio>

<script>
const flowers=[...document.querySelectorAll('.flower')];
flowers.forEach(f=>{
  const parts=[];
  for(let i=0;i<8;i++) parts.push(`<i class="petal" style="--i:${i}"></i>`);
  f.innerHTML=parts.join('')+'<i class="center"></i>';
});

const stars=document.getElementById('stars');
for(let i=0;i<150;i++){
  const s=document.createElement('span'); s.className='star';
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.setProperty('--t',(1.2+Math.random()*3)+'s');
  s.style.animationDelay=(Math.random()*3)+'s';
  stars.appendChild(s);
}

const dust=document.getElementById('petals');
for(let i=0;i<75;i++){
  const d=document.createElement('span'); d.className='dust';
  d.style.left=Math.random()*100+'%'; d.style.top=(55+Math.random()*55)+'%';
  d.style.setProperty('--x',(Math.random()*160-80)+'px');
  d.style.setProperty('--t',(3+Math.random()*6)+'s');
  d.style.animationDelay=(-Math.random()*7)+'s';
  dust.appendChild(d);
}

const phrases=[
 ['Te amo 💛',50,43],['Eres mi sol ☀️',10,56],['Mi amor ❤️',76,52],
 ['Me encantas 🌻',71,72],['Eres preciosa ✨',61,39],['Siempre juntos 🤍',20,74],
 ['Eres mi todo 💛',9,82],['Te amo',43,88]
];
const words=document.getElementById('words');
phrases.forEach(([t,x,y],i)=>{
  const e=document.createElement('div'); e.className='word'; e.textContent=t;
  e.style.left=x+'%'; e.style.top=y+'%'; e.style.animationDelay=(i*.18)+'s';
  words.appendChild(e);
});

let started=false;
const bgMusic=document.getElementById('bgMusic');
if (bgMusic) bgMusic.volume=0.42;

document.getElementById('openBtn').onclick=()=>{
  started=true;
  document.getElementById('intro').classList.add('hide');
  setTimeout(()=>document.getElementById('finalCard').classList.add('show'),5200);
  if (bgMusic) bgMusic.play().catch(()=>{});
};

document.getElementById('music').onclick=()=>{
  if(bgMusic.paused){
    if (bgMusic) bgMusic.play().catch(()=>{});
  }else{
    bgMusic.pause();
  }
};
</script>

</body>
</html>
